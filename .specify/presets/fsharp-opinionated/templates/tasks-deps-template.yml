schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md.
#
# Every Tnnn id that appears in tasks.md MUST appear as a key here. Each task
# value MUST include:
#   deps: ordered list of explicit non-phase dependencies
#   skillist: ordered list of applicable capability skill identifiers
# Use skillist: [] when no capability skill applies.
#
# Phase-checkpoint edges are auto-injected by the script (every task in
# Phase N+1 implicitly depends on the last foundation task of Phase N).
# Only write non-phase cross-edges here.
#
# Example:
#   T015:
#     deps: [T011, T013]
#     skillist: ["fs-skia-layout"]

