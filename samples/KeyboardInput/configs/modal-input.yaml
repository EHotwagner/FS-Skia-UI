version: 1
defaultLayout: colemacs-dh
defaultMode: selection
layouts:
  - id: qwerty
    displayName: QWERTY
    labels:
      KeyH: h
      KeyL: l
      Space: space
      KeyC: c
      KeyD: d
      Digit1: "1"
    positions:
      - id: KeyH
        hand: right
        finger: index
        row: 2
        column: 6
      - id: KeyL
        hand: right
        finger: ring
        row: 2
        column: 9
      - id: Space
        hand: either
        finger: thumb
        row: 4
        column: 5
      - id: KeyC
        hand: left
        finger: middle
        row: 3
        column: 2
      - id: KeyD
        hand: left
        finger: middle
        row: 2
        column: 2
      - id: Digit1
        hand: left
        finger: pinky
        row: 0
        column: 0
  - id: dvorak
    displayName: Dvorak
    labels:
      KeyH: d
      KeyL: n
      Space: space
      KeyC: j
      KeyD: e
      Digit1: "1"
    positions:
      - id: KeyH
        hand: right
        finger: index
        row: 2
        column: 6
      - id: KeyL
        hand: right
        finger: ring
        row: 2
        column: 9
      - id: Space
        hand: either
        finger: thumb
        row: 4
        column: 5
      - id: KeyC
        hand: left
        finger: middle
        row: 3
        column: 2
      - id: KeyD
        hand: left
        finger: middle
        row: 2
        column: 2
      - id: Digit1
        hand: left
        finger: pinky
        row: 0
        column: 0
  - id: colemacs-dh
    displayName: Colemak-DH
    labels:
      KeyH: m
      KeyL: i
      Space: space
      KeyC: c
      KeyD: s
      Digit1: "1"
    positions:
      - id: KeyH
        hand: right
        finger: index
        row: 2
        column: 6
      - id: KeyL
        hand: right
        finger: ring
        row: 2
        column: 9
      - id: Space
        hand: either
        finger: thumb
        row: 4
        column: 5
      - id: KeyC
        hand: left
        finger: middle
        row: 3
        column: 2
      - id: KeyD
        hand: left
        finger: ring
        row: 2
        column: 2
      - id: Digit1
        hand: left
        finger: pinky
        row: 0
        column: 0
  - id: workman
    displayName: Workman
    labels:
      KeyH: h
      KeyL: o
      Space: space
      KeyC: m
      KeyD: e
      Digit1: "1"
    positions:
      - id: KeyH
        hand: right
        finger: index
        row: 2
        column: 6
      - id: KeyL
        hand: right
        finger: ring
        row: 2
        column: 9
      - id: Space
        hand: either
        finger: thumb
        row: 4
        column: 5
      - id: KeyC
        hand: left
        finger: middle
        row: 3
        column: 2
      - id: KeyD
        hand: left
        finger: middle
        row: 2
        column: 2
      - id: Digit1
        hand: left
        finger: pinky
        row: 0
        column: 0
  - id: symbols
    displayName: Custom Symbols
    labels:
      KeyH: "<"
      KeyL: ">"
      Space: layer
      KeyC: copy
      KeyD: del
      Digit1: mode
    positions:
      - id: KeyH
        hand: right
        finger: index
        row: 2
        column: 6
      - id: KeyL
        hand: right
        finger: ring
        row: 2
        column: 9
      - id: Space
        hand: either
        finger: thumb
        row: 4
        column: 5
      - id: KeyC
        hand: left
        finger: middle
        row: 3
        column: 2
      - id: KeyD
        hand: left
        finger: middle
        row: 2
        column: 2
      - id: Digit1
        hand: left
        finger: pinky
        row: 0
        column: 0
modes:
  - id: selection
    displayName: Selection
    kind: stateful
    states: [character, line]
    defaultState: character
  - id: space
    displayName: Space menu
    kind: popup
    cancelKeys: [Escape]
  - id: copy
    displayName: Copy
    kind: temporary
  - id: delete
    displayName: Delete
    kind: temporary
bindings:
  - mode: selection
    key: KeyH
    outcome: command
    command: move.left
    weight: 10
  - mode: selection
    key: KeyL
    outcome: command
    command: move.right
    weight: 9
  - mode: selection
    key: Digit1
    outcome: set-state
    targetMode: selection
    state: line
  - mode: selection
    key: Space
    outcome: popup
    targetMode: space
  - mode: selection
    key: KeyC
    outcome: temporary
    targetMode: copy
  - mode: selection
    key: KeyD
    outcome: temporary
    targetMode: delete
  - mode: space
    key: KeyH
    outcome: command
    command: open.palette
  - mode: copy
    key: KeyH
    outcome: command
    command: copy.selection
    held: [KeyC]
  - mode: delete
    key: KeyH
    outcome: command
    command: delete.selection
    held: [KeyD]
disambiguation:
  timeoutMilliseconds: 175
bigramProfile:
  suggestionLimit: 20
  weights:
    - first: move.left
      second: move.right
      weight: 120
    - first: copy.selection
      second: delete.selection
      weight: 40
display:
  showLayoutState: true
  showPendingSequence: true
commandIntents:
  - id: risky-delete
    command: delete.selection
    constraints: [approval-required]
