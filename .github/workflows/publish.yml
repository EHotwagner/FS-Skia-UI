# Publish the 11 libraries + template to nuget.org using NuGet Trusted Publishing
# (GitHub OIDC -> short-lived nuget.org API key). No long-lived secret is stored:
# `NuGet/login@v1` exchanges this job's signed OIDC token for a temporary key
# (valid ~1h, single-use) and exposes it as `NUGET_API_KEY` -- exactly the env var
# the compiled `Publish` target already reads (build/Governance/Front/Governance.fs).
# `Publish` depends on PrePublishCheck + PackLocal + TemplatePack, so this one call
# validates pins/metadata, packs all 12 artifacts, then pushes with --skip-duplicate.
#
# Manual-only and gated behind the protected `release` environment so a maintainer
# approves each run. The version pushed is whatever <FsSkiaUiVersion> resolves to.
#
# One-time setup on nuget.org (Username -> Trusted Publishing -> Add policy):
#   Repository Owner: <your GitHub org/user>
#   Repository:       FS-Skia-UI
#   Workflow File:    publish.yml      (filename only, no path)
#   Environment:      release
# And add one repo secret: NUGET_USER = your nuget.org profile name (NOT your email).

name: Publish to nuget.org

on:
  workflow_dispatch:

# FAKE shares repository .fake state and is not concurrency-safe; never overlap runs.
concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # mint the GitHub OIDC token for the nuget.org exchange
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The pre-publish gate (Publish -> PrePublishCheck -> TemplateCheck -> TemplateSmoke
      # -> Test) runs the Silk.NET.Windowing (GLFW) + Silk.NET.Vulkan GUI suite, so a hosted
      # runner needs a virtual X display AND a software Vulkan device. Xvfb supplies the
      # display (BuildEnvironment then classifies X11Only -> normalization no-ops); Mesa
      # lavapipe (mesa-vulkan-drivers) supplies a CPU Vulkan device; the rest are GLFW/Skia
      # native runtime deps.
      - name: Install headless graphics stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libgl1-mesa-dri libglu1-mesa \
            libx11-6 libxrandr2 libxi6 libxcursor1 libxinerama1 libxext6 \
            libfontconfig1

      # Confirm a software Vulkan device (lavapipe) is actually visible before we rely on it.
      - name: Verify Vulkan device
        run: xvfb-run -a vulkaninfo --summary || true

      # Exchange the OIDC token for a short-lived nuget.org API key, right before the
      # push because the key expires in ~1 hour.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name that owns the trusted-publishing policy + packages.
          # Public (not sensitive), so it's inlined rather than read from a secret.
          user: Paradigma11

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          # Force Mesa software rendering (no GPU on the runner). lavapipe is auto-discovered
          # via its ICD; LIBGL_ALWAYS_SOFTWARE covers any GL fallback path.
          LIBGL_ALWAYS_SOFTWARE: "1"
        # xvfb-run provisions DISPLAY for the GUI suite for the whole dependency chain.
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" ./fake.sh build -t Publish

      # The native-GUI suites capture stdout/stderr to readiness/logs/*.txt; surface them
      # inline when the gate fails so the real crash cause is visible without an artifact.
      - name: Dump readiness logs on failure
        if: failure()
        run: |
          for f in specs/064-publish-nuget-distribution/readiness/logs/test.txt \
                   specs/064-publish-nuget-distribution/readiness/logs/smoke.txt; do
            echo "::group::$f"
            cat "$f" 2>/dev/null || echo "(missing)"
            echo "::endgroup::"
          done
