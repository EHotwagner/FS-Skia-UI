defaults:
  broad_fallback_command: "./fake.sh build -t Verify"
  unknown_gate_rejection:
    owner: governance
    diagnostic: "unknown gate is rejected with no success verdict"
  final_gates:
    - EvidenceGraph
    - EvidenceAudit

tiers:
  inner-loop:
    authority: non-authoritative
    default_gates:
      - Dev
  focused-authority:
    authority: focused-authoritative
    default_gates:
      - EvidenceGraph
  agent-ready:
    authority: focused-authoritative
    default_gates:
      - AgentReady
      - EvidenceGraph
      - EvidenceAudit
  maintainer-verify:
    authority: broad-authoritative
    default_gates:
      - Verify
  automation-final:
    authority: broad-authoritative
    default_gates:
      - Ci
  tier1:
    authority: focused-authoritative
    default_gates:
      - AgentReady
      - EvidenceGraph
      - EvidenceAudit
  tier2:
    authority: non-authoritative
    default_gates:
      - Dev

routing_rules:
