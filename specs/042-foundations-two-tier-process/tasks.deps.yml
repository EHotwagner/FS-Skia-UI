schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md.
#
# Every Tnnn id in tasks.md appears as a key here with both `deps` and
# `skillist`. Phase-checkpoint edges (every Phase N+1 task -> last foundation
# task of Phase N) are auto-injected by the graph script; only non-phase
# cross-edges are written here.
#
# This feature is build-tooling only (build/Governance + build.fsx), so no
# fs-skia-* runtime skill applies. It CONSUMES the fsharp-* cookbooks as
# implementation aids: fsharp-io-globbing (the glob RoutingRule predicates,
# T009), fsharp-build-orchestration (Expecto typed-selector tests + FAKE edge
# wiring + serialized gates, T008/T010/T012/T014/T015/T017/T019/T023), and
# fsharp-code-generation (ContractView.render YAML emission, T020). The
# graph/audit workflow skills appear only on T029/T030. fsharp-shell-process,
# fsharp-graph-algorithms, and fsharp-parsing are deliberately NOT assigned
# (see the skill-assignment note in tasks.md).

