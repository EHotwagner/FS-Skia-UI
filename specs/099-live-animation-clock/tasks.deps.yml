schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md (feature 099).
#
# This file begins with a `schema_version` scalar and a top-level `tasks:`
# mapping (the wrapper). Every Tnnn id in tasks.md appears once here with
# `deps` and `skillist`; `owns` is present only where a task owns gated
# evidence (closed vocabulary). Phase-checkpoint edges (every task in Phase
# N+1 depends on the last foundation task of Phase N) are auto-injected by the
# graph compute script — only non-phase cross-edges are written here.

tasks:
