  T001:
    deps: []
    skillist: []
  T002:
    deps: []
    skillist: ["fs-skia-evidence-mode"]
  T003:
    deps: []
    skillist: []
  T004:
    deps: []
    skillist: []

  # Phase 2 — Foundation (Tier-1 internal slot generalization + pure core)
  T005:
    deps: []
    skillist: ["fs-skia-reconciliation"]
  T006:
    deps: [T005]
    skillist: ["fs-skia-reconciliation", "fs-skia-scene"]
  T007:
    deps: []
    skillist: ["fs-skia-evidence-mode"]

  # Phase 3 — User Story 1 (a transition animates on the live host)
