schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md (feature 097).
#
# This file begins with a `schema_version` scalar and a top-level `tasks:`
# mapping (the wrapper). Every Tnnn id in tasks.md appears once here with
# `deps` and `skillist`; `owns` is present only where a task owns gated
# evidence (closed vocabulary). Phase-checkpoint edges (every task in Phase
# N+1 depends on the last foundation task of Phase N) are auto-injected by the
# graph compute script — only non-phase cross-edges are written here.

tasks:
  # Phase 1 — Setup
  T001:
    deps: []
    skillist: []
  T002:
    deps: []
    skillist: ["fs-skia-evidence-mode"]
  T003:
    deps: []
    skillist: []
  T004:
    deps: []
    skillist: []

  # Phase 2 — Foundation
  T005:
    deps: []
    skillist: ["fs-skia-layout"]
  T006:
    deps: []
    skillist: ["fs-skia-reconciliation", "fs-skia-ui-widgets"]
  T007:
    deps: []
    skillist: ["fs-skia-evidence-mode"]

  # Phase 3 — User Story 1 (localized re-measure)
  T008:
    deps: []
    skillist: ["fs-skia-reconciliation", "fs-skia-testing"]
  T009:
    deps: [T006, T008]
    skillist: ["fs-skia-reconciliation"]
  T010:
    deps: [T005, T008]
    skillist: ["fs-skia-layout", "fs-skia-reconciliation"]
  T011:
    deps: [T005, T008, T010]
    skillist: ["fs-skia-layout"]
  T012:
    deps: [T006]
    skillist: ["fs-skia-reconciliation"]
  T013:
    deps: [T006, T009, T011, T012]
    skillist: ["fs-skia-elmish", "fs-skia-reconciliation"]

  # Phase 4 — User Story 2 (equivalence invariant)
  T014:
    deps: []
    skillist: ["fs-skia-layout", "fs-skia-testing"]
  T015:
    deps: []
    skillist: ["fs-skia-layout", "fs-skia-testing"]
  T016:
    deps: []
    skillist: ["fs-skia-reconciliation", "fs-skia-testing"]
  T017:
    deps: [T014, T015, T016]
    skillist: ["fs-skia-layout", "fs-skia-evidence-mode"]

  # Phase 5 — User Story 3 (re-measure metric)
  T018:
    deps: []
    skillist: ["fs-skia-reconciliation", "fs-skia-testing"]
  T019:
    deps: [T018]
    skillist: ["fs-skia-reconciliation", "fs-skia-evidence-mode"]

  # Phase 6 — Integration & Polish
  T020:
    deps: [T013]
    skillist: ["fs-skia-reconciliation", "fs-skia-evidence-mode"]
  T021:
    deps: [T013]
    skillist: ["fs-skia-reconciliation", "fs-skia-evidence-mode"]
  T022:
    deps: [T011]
    skillist: ["fs-skia-layout"]
  T023:
    deps: [T005]
    skillist: ["fs-skia-layout"]
  T024:
    deps: [T020, T021, T022, T023]
    skillist: ["fs-skia-testing"]
  T025:
    deps: [T024]
    skillist: ["speckit-evidence-graph"]
    owns: ["graph-validation"]
  T026:
    deps: [T025]
    skillist: ["speckit-evidence-audit"]
    owns: ["evidence-audit"]
