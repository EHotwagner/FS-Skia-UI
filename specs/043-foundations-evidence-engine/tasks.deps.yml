schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md.
#
# Every Tnnn id in tasks.md appears as a key here with both `deps` and
# `skillist`. Phase-checkpoint edges (every Phase N+1 task -> last foundation
# task of Phase N) are auto-injected by the graph compute; only non-phase
# cross-edges are written here (e.g. T009/T021 -> T006 for the captured golden
# fixtures, T028 -> T005 for the published package).
#
# Build-tooling only (build/Governance/Evidence + build.fsx + template/base), so
# no fs-skia-* runtime skill applies to the engine. It CONSUMES the fsharp-*
# cookbooks (parsing -> the parsers/scans; io-globbing -> SkillRegistry;
# graph-algorithms -> Graph + its tests; code-generation -> Render;
# build-orchestration -> golden-diff/tests/gate-wiring/serialized run;
# shell-process -> the edge `git diff`) and reuses fs-skia-template-update for
# the publish/template/pack track. The graph/audit workflow skills appear only
# on T033/T034. fs-skia-skiaviewer / fs-skia-layout-evidence are deliberately
# NOT assigned to the Scans port (T015) -- those are text scans, not viewer
# work (see the skill-assignment note in tasks.md).

tasks:
  T001:
    deps: []
    skillist: []
  T002:
    deps: []
    skillist: []
