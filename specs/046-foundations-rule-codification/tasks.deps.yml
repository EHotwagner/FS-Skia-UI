schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md.
#
# Every Tnnn id in tasks.md appears as a key here with both `deps` and
# `skillist`. Phase-checkpoint edges (every Phase N+1 task -> last task of
# Phase N) are auto-injected by the graph compute; only non-phase cross-edges
# and within-phase edges are written here.
#
# Build-tooling / governance only (build/Governance/** + tests/Governance.Tests/**
# + .agents/skills/** + .gitignore + the active spec tree), so no fs-skia-*
# runtime skill applies. It CONSUMES the fsharp-* cookbooks:
#   parsing            -> the plan.md Repository-Governance-Decisions parser
#                         (classifyConstitutionCheck) + its typed-result test;
#   code-generation    -> the typed versioned-contract data + renderContractHeader;
#   build-orchestration-> the Expecto typed tests, folding the finding into
#                         GeneratedGuidanceCheck, and the serialized FAKE run.
# The graph/audit workflow skills appear only on T025/T026. fsharp-graph-algorithms,
# fsharp-io-globbing, fsharp-shell-process, fs-skia-template-update, and
# speckit-constitution are NOT assigned -- see the skill-assignment note in tasks.md
# (the new gate uses the camelCase `ConstitutionCheck` identifier in titles so the
# `constitution` trigger group is not falsely fired).
#
# Non-phase cross-edges and within-phase edges captured below:
#   T003 -> T002                 readiness notes after the placeholders exist
#   T006 -> {T004,T005}          FSI exercises both drafted .fsi surfaces
#   T007 -> T006                 record surface handling after the FSI exercise
#   T010 -> {T008,T009}          impl after the failing tests + fixtures exist
#   T011 -> T010 ; T012 -> T011  gate wiring then live run, in order
#   T014 -> T013 ; T015 -> T014 ; T016 -> T015   contract impl -> consult -> live
#   T027 -> T014                 changelog/schema consistency test+impl over `current`
#   T018 -> {T012,T017}          gate-before-prose: trim only after the new gate
#                                (T012) and the three shipped gates (T017) are proven
#   T019 -> T018 ; T020 -> T019  regenerate then measure after the trim
#   T022 -> T021                 git check-ignore proof after the .gitignore edit
#   T024 -> {T016,T020,T022,T023,T027}  serialized run after contract live, prose
#                                measured, gitignore proven, invariants captured
#   T025 -> T024 ; T026 -> T025  graph before audit, after the serialized gates

