version: 1
defaultLayout: qwerty
defaultMode: selection
layouts:
  - id: qwerty
    displayName: QWERTY
    labels:
      KeyH: h
    positions:
      - id: KeyH
        hand: right
        finger: index
        row: 2
        column: 6
modes:
  - id: selection
    displayName: Selection
    kind: stateful
    states: [character]
    defaultState: character
bindings:
  - mode: selection
    key: KeyH
    outcome: command
    command: move.left
  - mode: selection
    key: KeyH
    outcome: command
    command: move.left
