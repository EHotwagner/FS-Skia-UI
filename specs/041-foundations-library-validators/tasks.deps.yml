schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md.
#
# Every Tnnn id in tasks.md appears as a key here with both `deps` and
# `skillist`. Phase-checkpoint edges (every Phase N+1 task -> last foundation
# task of Phase N) are auto-injected by the graph script; only non-phase
# cross-edges are written here.
#
# This feature CONSUMES the fsharp-* cookbooks as implementation aids (see the
# skill-assignment note in tasks.md), so they legitimately appear in skillist:
# fsharp-parsing (YAML catalog read, T014), fsharp-code-generation (report
# rendering, T006/T011), fsharp-build-orchestration (golden-diff parity, Expecto
# tests, FAKE in-process wiring). The graph/audit workflow skills appear only on
# T022/T023.

tasks:
  T001:
    deps: []
    skillist: ["fsharp-build-orchestration"]
