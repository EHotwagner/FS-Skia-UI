schema_version: "1.0"

# Dependency topology and task skill metadata for tasks.md.
#
# Every Tnnn id in tasks.md appears as a key here with both `deps` and
# `skillist`. Phase-checkpoint edges (every Phase N+1 task -> last task of
# Phase N) are auto-injected by the graph compute; only non-phase cross-edges
# are written here (e.g. T011 -> {T008, T009} for the build.fsx wiring that
# needs SkillTreeGen + the reframed SkillSync; T024/T027/T028 -> their evidence
# inputs across phases).
#
# Build-tooling / governance only (build/Governance + build.fsx + .specify +
# the skill trees), so no fs-skia-* runtime skill applies. It CONSUMES the
# fsharp-* cookbooks (io-globbing -> SkillTreeGen enumeration + currency-diffing;
# code-generation -> the manifest / annotation / fragment emission;
# parsing -> the ### Principle extraction + the [skillist: ...] splice anchor;
# build-orchestration -> the build.fsx gate/effect wiring, Expecto harnesses,
# and the serialized run). The graph/audit workflow skills appear only on
# T029/T030. fsharp-shell-process is deliberately NOT assigned (in-process
# copy-generation, no diff/cmp/sha256sum/git shelling) and fs-skia-template-update
# is NOT assigned (governance marker regions, not a dotnet-new product / pin
# change) -- see the skill-assignment note in tasks.md.

